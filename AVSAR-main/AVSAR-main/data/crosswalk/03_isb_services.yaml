# AVSAR crosswalk — Industry, Service & Business (ISB)
#
# GIA domain 9 of the illustrative list (research.md §2.4). The portal describes
# ISB as "21 sub-items including manufacturing units, IT/ITeS services, Media &
# Entertainment, Healthcare, Banking & Financial Services, Beauty parlour,
# Plumbing, Auto repair, Bakery, and other sustainable units as per local needs".
#
# This is the densest file because it carries the trades PLAN.md §5.2 names for
# the demo: tailoring/garment, beauty & wellness, electrician/plumbing, mobile
# repair, healthcare attendant, IT/ITeS data-entry, retail.
#
# Every qp_code is a real NCVET qualification in
# seeds/kaushalverse_qualifications.json.

