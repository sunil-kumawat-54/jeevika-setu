  - concept: poultry
    gia_domain: 4
    status: reviewed
    qp_codes: []
    gap_reason: >-
      No poultry qualification exists anywhere in the NCVET Kaushalverse snapshot
      this build ingested (verified: 0 matches for poultry/broiler/hatchery/layer
      across all 1,170 approved Qualifications). The real PM-AJAY GIA catalogue
      does list poultry roles, but the portal was serving its maintenance page
      during ingestion — see docs/ingest-report.md. Mapping "murgi palan" to a
      near-miss livestock QP would make AVSAR confidently recommend the wrong
      trade, so the concept is declared as a GAP instead: the recommender falls
      through to semantic recall and then to refusal/handoff, and the officer
      dashboard's gap panel flags it as demand with no local supply. Restored
      automatically once pipeline 01 can reach the live catalogue.
    phrases:
      hi: ["मुर्गी पालन", "मुर्गी फार्म", "अंडे का काम"]
      mr: ["कुक्कुटपालन", "कोंबडी पालन"]
      te: ["కోళ్ల పెంపకం", "కోడి ఫారం"]
      en: ["poultry farming", "poultry", "broiler farm"]

