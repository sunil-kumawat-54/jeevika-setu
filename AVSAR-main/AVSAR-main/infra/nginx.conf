# AVSAR reverse proxy (profile: full). TLS terminated by Caddy/nginx in prod.
upstream avsar_core { server core:8000; }
upstream avsar_web  { server web:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;   # 15 s of 16 kHz mono WAV + base64 overhead

    location /api/core/ {
        proxy_pass         http://avsar_core/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: never buffer the /sessions/{id}/turn stream
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass         http://avsar_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }
}
