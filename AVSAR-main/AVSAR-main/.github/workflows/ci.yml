name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ruff + pytest
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avsar
          POSTGRES_PASSWORD: avsar
          POSTGRES_DB: avsar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avsar -d avsar"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://avsar:avsar@localhost:5432/avsar
      REDIS_URL: redis://localhost:6379/0
      VOICE_PROVIDER: mock
      LLM_PROVIDER: mock
      EMBEDDING_BACKEND: hashing
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/core/requirements-dev.txt
      - name: Enable pgvector
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=avsar psql -h localhost -U avsar -d avsar -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: ruff
        run: ruff check services pipelines scripts
      - name: Alembic migrations from a clean database
        run: alembic -c services/core/alembic.ini upgrade head
      - name: pytest
        run: pytest -q
      - name: Assert CI grounding contract
        run: python scripts/assert_ci_grounding.py .github/workflows/ci.yml
      - name: Grounding verification
        run: python scripts/verify_grounding.py --n 50
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: pip-audit -r services/core/requirements.txt

  frontend:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev
