[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "apps/web",
    ".venv",
    "alembic/versions",
    "services/core/alembic/versions",
    "scripts/_tmp",  # gitignored scratch space for one-off verification scripts
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
"services/core/tests/*" = ["E402"]
"pipelines/*" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["services", "."]
testpaths = ["services/core/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
